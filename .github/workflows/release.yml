name: Release

# Build and publish the npm package when a GitHub Release is published.
# Uses npm Trusted Publishing (OIDC): no long-lived NPM_TOKEN is stored. The
# package's npm settings must list this repo + workflow as a trusted publisher.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mint the OIDC token npm exchanges for a short-lived publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which supports trusted publishing (needs >= 11.5.1).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Confirm npm supports trusted publishing
        run: npm --version && node --version

      - name: Install
        run: npm ci

      - name: Verify (syntax + tests + 100% line coverage)
        # React's test `act` only exists in the development build; keep NODE_ENV
        # off "production" or every mounted-component test fails.
        run: npm run check
        env:
          NODE_ENV: development

      - name: Guard that package.json matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG tag=$TAG"
          test "$PKG" = "$TAG"

      - name: Build npm package
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"

      - name: Publish to npm (OIDC, with provenance)
        run: npm publish ./*.tgz --access public --provenance
