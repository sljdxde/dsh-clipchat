name: CI

# Hermetic check on every push and pull request: syntax, tests, and the 100%
# line-coverage gate. The browser probes need a local DSH install and Chrome, so
# they stay manual (`node e2e/probe-composer.mjs`, `node e2e/run.mjs`).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (syntax + tests + 100% line coverage)
        # React's test `act` only exists in the development build; keep NODE_ENV
        # off "production" or every mounted-component test fails.
        run: npm run check
        env:
          NODE_ENV: development
